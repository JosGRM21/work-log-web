services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: work_log_web_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_dev_pwd@postgres:5432/work_log_web_db?schema=public
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: work_log_web_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_pwd
      POSTGRES_DB: work_log_web_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d work_log_web_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
